name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Test & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm test

  build:
    name: Build Extension
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dist/ output
        run: |
          test -f dist/background.js || (echo "❌ background.js missing" && exit 1)
          test -f dist/content.js    || (echo "❌ content.js missing"    && exit 1)
          test -f dist/popup.html    || (echo "❌ popup.html missing"    && exit 1)
          test -f dist/dashboard.html|| (echo "❌ dashboard.html missing"&& exit 1)
          echo "✅ All required dist files present"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: oximy-shield-${{ github.sha }}
          path: dist/
          retention-days: 14
