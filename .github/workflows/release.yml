name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Zip extension
        run: |
          cd dist
          zip -r ../oximy-shield-${{ github.ref_name }}.zip .
          cd ..
          echo "Built oximy-shield-${{ github.ref_name }}.zip"
          ls -lh oximy-shield-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: oximy-shield-${{ github.ref_name }}.zip
          generate_release_notes: true
          body: |
            ## Oximy Shield ${{ github.ref_name }}

            Download `oximy-shield-${{ github.ref_name }}.zip`, unzip it, then:
            1. Open Chrome → `chrome://extensions/`
            2. Enable **Developer mode**
            3. Click **Load unpacked** → select the unzipped folder

            See [CHANGELOG.md](CHANGELOG.md) for what changed in this release.
